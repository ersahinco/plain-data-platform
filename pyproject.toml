[project]
name = "plain-data-platform"
version = "0.1.0"
description = "Practical data infrastructure for everyday teams."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "dagster==1.13.25",
  "dagster-webserver==1.13.25",
  "dlt[duckdb]==1.30.0",
  "duckdb==1.5.6",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
ml = ["scikit-learn==1.9.1"]
ops = ["ansible-core==2.21.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
